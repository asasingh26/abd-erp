<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parties & Accounts Master - Adhikari Book Depot ERP</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 font-sans antialiased min-h-screen p-6">

    <div class="max-w-6xl mx-auto">
        <!-- Header -->
        <div class="flex flex-col md:flex-row justify-between items-center mb-8 bg-slate-800/60 backdrop-blur-xl border border-slate-700/50 p-6 rounded-2xl shadow-xl">
            <div>
                <h1 class="text-2xl font-bold text-white flex items-center gap-3">
                    <i class="fa-solid fa-address-book text-indigo-400"></i> Parties & Accounts Master
                </h1>
                <p class="text-xs text-slate-400 mt-1">Manage publishers, schools, and customer accounts</p>
            </div>
            <div class="mt-4 md:mt-0 flex gap-3">
                <a href="../index.html" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-slate-200 text-sm font-medium rounded-xl transition flex items-center gap-2">
                    <i class="fa-solid fa-arrow-left"></i> Back to Dashboard
                </a>
                <button onclick="openAddModal()" class="px-5 py-2 bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-semibold rounded-xl shadow-lg transition flex items-center gap-2">
                    <i class="fa-solid fa-plus"></i> Add New Party
                </button>
            </div>
        </div>

        <!-- Search & Filter Bar -->
        <div class="mb-6 flex gap-4 items-center">
            <div class="relative flex-1">
                <i class="fa-solid fa-search absolute left-4 top-3.5 text-slate-400"></i>
                <input type="text" id="searchInput" onkeyup="filterParties()" placeholder="Search by party name, phone, or type..." class="w-full bg-slate-800/80 border border-slate-700 rounded-xl pl-11 pr-4 py-3 text-sm text-slate-100 focus:outline-none focus:border-indigo-500 transition">
            </div>
        </div>

        <!-- Parties Table -->
        <div class="bg-slate-800/60 backdrop-blur-xl border border-slate-700/50 rounded-2xl shadow-xl overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-slate-700 text-slate-400 text-xs uppercase tracking-wider bg-slate-900/40">
                            <th class="p-4">Party Name</th>
                            <th class="p-4">Type</th>
                            <th class="p-4">Contact Person</th>
                            <th class="p-4">Phone Number</th>
                            <th class="p-4">City / Address</th>
                            <th class="p-4 text-center">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="partiesTableBody" class="divide-y divide-slate-700/50 text-sm">
                        <!-- Dynamic Data will load here -->
                        <tr>
                            <td colspan="6" class="p-8 text-center text-slate-400">
                                <i class="fa-solid fa-spinner fa-spin mr-2"></i> Loading parties data...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Add/Edit Party Modal -->
    <div id="partyModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
        <div class="bg-slate-800 border border-slate-700 rounded-2xl w-full max-w-lg p-6 shadow-2xl relative">
            <h3 id="modalTitle" class="text-xl font-bold text-white mb-4 flex items-center gap-2">
                <i class="fa-solid fa-user-plus text-indigo-400"></i> Add New Party
            </h3>
            
            <form id="partyForm" onsubmit="saveParty(event)" class="space-y-4">
                <input type="hidden" id="partyIndex">
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">Party / Business Name *</label>
                    <input type="text" id="partyName" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1">Party Type *</label>
                        <select id="partyType" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
                            <option value="Publisher">Publisher</option>
                            <option value="School">School</option>
                            <option value="Customer / Retailer">Customer / Retailer</option>
                            <option value="Supplier">Supplier</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1">Phone Number</label>
                        <input type="text" id="partyPhone" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">Contact Person</label>
                    <input type="text" id="partyContact" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">Address / City</label>
                    <textarea id="partyAddress" rows="2" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500"></textarea>
                </div>

                <div class="flex justify-end gap-3 pt-4 border-t border-slate-700">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-slate-300 text-sm font-medium rounded-xl transition">Cancel</button>
                    <button type="submit" id="saveBtn" class="px-5 py-2 bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-semibold rounded-xl shadow transition">Save Party</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Script Integration -->
    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwPetyZfVCgLtK02MFxoFTpU-WXjRfOv7T_klr32Z3x52UdOhp_9my3QWpUPiBz2hH5/exec"; // Apne Orders wala exact Apps Script URL yahan paste kar dein

        let partiesList = [];

        // Fetch Parties on Load
        window.onload = function() {
            fetchParties();
        };

        function fetchParties() {
            // Agar Apps Script URL set hai toh fetch karenge, warna sample data dikhayenge
            if(SCRIPT_URL.includes("SCRIPT_URL") || SCRIPT_URL === "") {
                partiesList = [
                    { name: "Sample Publisher", type: "Publisher", contact: "Rajesh Kumar", phone: "9839704638", address: "Kalyanpur, Kanpur" },
                    { name: "Delhi Public School", type: "School", contact: "Principal", phone: "9876543210", address: "Radhapuram, Kanpur" }
                ];
                renderTable(partiesList);
                return;
            }

            fetch(SCRIPT_URL + "?action=getParties")
                .then(res => res.json())
                .then(data => {
                    partiesList = data.parties || [];
                    renderTable(partiesList);
                })
                .catch(err => {
                    console.error("Error fetching parties:", err);
                    document.getElementById("partiesTableBody").innerHTML = `<tr><td colspan="6" class="p-8 text-center text-red-400">Failed to load data from server.</td></tr>`;
                });
        }

        function renderTable(data) {
            const tbody = document.getElementById("partiesTableBody");
            if(data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="p-8 text-center text-slate-400">No parties found. Click "Add New Party" to create one.</td></tr>`;
                return;
            }

            tbody.innerHTML = data.map((p, index) => `
                <tr class="hover:bg-slate-700/30 transition">
                    <td class="p-4 font-semibold text-white">${p.name || ''}</td>
                    <td class="p-4"><span class="px-2.5 py-1 bg-indigo-500/20 text-indigo-300 text-xs rounded-full font-medium">${p.type || ''}</span></td>
                    <td class="p-4 text-slate-300">${p.contact || '-'}</td>
                    <td class="p-4 text-slate-300">${p.phone || '-'}</td>
                    <td class="p-4 text-slate-400 text-xs">${p.address || '-'}</td>
                    <td class="p-4 text-center">
                        <button onclick="editParty(${index})" class="p-2 text-indigo-400 hover:text-indigo-300 transition" title="Edit"><i class="fa-solid fa-pen-to-square"></i></button>
                    </td>
                </tr>
            `).join('');
        }

        function filterParties() {
            const query = document.getElementById("searchInput").value.toLowerCase();
            const filtered = partiesList.filter(p => 
                (p.name && p.name.toLowerCase().includes(query)) ||
                (p.phone && p.phone.toLowerCase().includes(query)) ||
                (p.type && p.type.toLowerCase().includes(query))
            );
            renderTable(filtered);
        }

        function openAddModal() {
            document.getElementById("modalTitle").innerHTML = `<i class="fa-solid fa-user-plus text-indigo-400"></i> Add New Party`;
            document.getElementById("partyForm").reset();
            document.getElementById("partyIndex").value = "";
            document.getElementById("partyModal").classList.remove("hidden");
        }

        function closeModal() {
            document.getElementById("partyModal").classList.add("hidden");
        }

        function saveParty(e) {
            e.preventDefault();
            const btn = document.getElementById("saveBtn");
            btn.innerText = "Saving...";
            btn.disabled = true;

            const partyData = {
                action: "saveParty",
                name: document.getElementById("partyName").value,
                type: document.getElementById("partyType").value,
                contact: document.getElementById("partyContact").value,
                phone: document.getElementById("partyPhone").value,
                address: document.getElementById("partyAddress").value
            };

            if(SCRIPT_URL.includes("SCRIPT_URL") || SCRIPT_URL === "") {
                setTimeout(() => {
                    partiesList.push(partyData);
                    renderTable(partiesList);
                    closeModal();
                    btn.innerText = "Save Party";
                    btn.disabled = false;
                }, 500);
                return;
            }

            fetch(SCRIPT_URL, {
                method: "POST",
                body: JSON.stringify(partyData)
            })
            .then(res => res.json())
            .then(res => {
                if(res.success) {
                    fetchParties();
                    closeModal();
                } else {
                    alert("Failed to save party: " + (res.message || "Unknown error"));
                }
                btn.innerText = "Save Party";
                btn.disabled = false;
            })
            .catch(err => {
                alert("Network error while saving.");
                btn.innerText = "Save Party";
                btn.disabled = false;
            });
        }
    </script>
</body>
</html>
